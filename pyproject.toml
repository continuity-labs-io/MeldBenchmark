[project]
name = "chronos-benchmark"
version = "0.1.0"
description = "CHRONOS benchmark"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",  # pyflakes
    "C4", # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
